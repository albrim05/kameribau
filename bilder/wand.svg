<title id="t">Zeichnung: Eine Ständerwand im Bau. Links sind Gipskartonplatten verschraubt, rechts steht das Metallständerwerk mit einer Türöffnung. Davor liegt halb verlegter Laminatboden, ein Zollstock, ein Spachteleimer und ein Plattenstapel.</title>
